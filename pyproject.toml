[project]
name = "retrieval-framework"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "pypdf>=4.0", "bcrypt>=4.0"]

[project.optional-dependencies]
dev = ["pytest"]
tools = ["reportlab>=4.0"]   # only for tools/generate_supplier_contracts.py

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
