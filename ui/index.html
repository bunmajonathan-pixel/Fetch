<footer><span>Illustrative workspace · Sample data only</span><span>Read-only · Session-based access</span></footer>
<script>
/* ===== Live DataService — calls the Flask backend at /api/* ===== */
const DataService={
  _token:null,
  _refreshTimer:null,
  async signIn({company,id,password}){
    let r,d;
    try{
      r=await fetch("/api/signin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company,id,password})});
      d=await r.json();
    }catch(err){
      console.error("signin failed:",err,r&&r.status);
      const e=new Error(r?("Unexpected server response (HTTP "+r.status+"). Check the server terminal for errors."):"Cannot reach the server.");
      e.code="NETWORK";throw e}
    if(!r.ok){const e=new Error(d.error||"Sign-in failed");e.code=d.code||"BAD_CREDENTIALS";throw e}
    this._token=d.token;this._scheduleRefresh();return{name:d.name,id:d.id,company:d.company,admin:!!d.admin}
  },
  async retrieve(text){
    const r=await fetch("/api/retrieve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:text,token:this._token})});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error||"Retrieve failed");e.code=d.code||"ERROR";throw e}
    return d
  },
  async analyze(filters){
    const body={token:this._token};
    for(const k of ["ticker","status","quarter","category","owner","renewal","sole_source"])if(filters[k])body[k]=filters[k];
    const r=await fetch("/api/analyze/contracts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error||"Analysis failed");e.code=d.code||"ERROR";throw e}
    return d
  },
  async analyzeBeh(filters){
    const body={token:this._token};
    for(const k of ["ticker","year","assessment"])if(filters[k]&&filters[k]!=="all"&&filters[k]!=="latest")body[k]=filters[k];
    const r=await fetch("/api/analyze/behavior",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error||"Analysis failed");e.code=d.code||"ERROR";throw e}
    return d
  },
  async admin(method,path,body){
    const r=await fetch("/api/admin"+path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error||"Request failed");e.code=d.code||"ERROR";throw e}
    return d
  },
  async views(method,path,body){
    const r=await fetch("/api/views"+(path||""),{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error||"Request failed");e.code=d.code||"ERROR";throw e}
    return d
  },
  async analyzeCo(filters){
    const body={token:this._token};
    if(filters.ticker)body.ticker=filters.ticker;
    const r=await fetch("/api/analyze/company",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error||"Analysis failed");e.code=d.code||"ERROR";throw e}
    return d
  },
  async analyzeFin(filters){
    const body={token:this._token};
    for(const k of ["ticker","from","to","metric"])if(filters[k]&&filters[k]!=="all")body[k]=filters[k];
    const r=await fetch("/api/analyze/financials",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error||"Analysis failed");e.code=d.code||"ERROR";throw e}
    return d
  },
  async refresh(){
    try{
      const r=await fetch("/api/refresh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:this._token})});
      const d=await r.json();
      if(r.ok&&d.token){this._token=d.token;this._scheduleRefresh()}
    }catch(e){}
  },
  _scheduleRefresh(){
    clearTimeout(this._refreshTimer);
    this._refreshTimer=setTimeout(()=>this.refresh(),55*60*1000);
  },
  async signOut(){
    clearTimeout(this._refreshTimer);
    await fetch("/api/signout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:this._token})});
    this._token=null
  }
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Render **bold** markers from server as <mark> highlights */
const hlSnippet=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<mark class="hl">$1</mark>');
const $=(s,r=document)=>r.querySelector(s);
const S={screen:"login",user:null,query:"",result:null,err:null,timer:null,end:0,page:0,warnShown:false,analysis:null,af:null,apage:0,aerr:null,fin:null,ff:null,ferr:null,beh:null,bf:null,berr:null};
const PAGE_SIZE=10;
const STEP={login:0,request:1,retrieving:2,notfound:2,results:3,analyzing:2,analytics:3,finalyzing:2,financials:3,banalyzing:2,behavior:3,canalyzing:2,company:3,adminloading:2,admin:3};
const SESSION_MIN=15;

/* ===== Dark / light mode ===== */
function getTheme(){return localStorage.getItem("theme")||"auto"}
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  localStorage.setItem("theme",t);
}
applyTheme(getTheme());
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark"?"light":cur==="light"?"auto":"dark");
  header();
}
function themeIcon(){const t=document.documentElement.getAttribute("data-theme");return t==="dark"?"☀️":t==="light"?"🌙":"🌓"}

  const st=STEP[S.screen];
  $("#hdr").innerHTML=`<header><div class="logo">▤</div><span class="brand">Fetch</span><span class="sub">Enterprise workspace</span><span class="sp"></span><span class="pill">Sample workspace</span><button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">${themeIcon()}</button>${S.user?`<span class="user"><span class="av">${esc(S.user.name.split(" ").map(w=>w[0]).join(""))}</span>${esc(S.user.name)} · ${esc(S.user.id)}</span>`:""}</header>
  <div class="crumb"><span>${S.user?esc(S.user.company?S.user.company.toUpperCase():S.user.id):"WORKSPACE"} / DATA WORKSPACE</span><div class="steps">${["Sign in","Request","Retrieve","Review"].map((n,i)=>i===st?`<span><b>${n}</b></span>`:`<span>${n}</span>`).join("")}</div></div>`;
}

 <div id="warn-slot"></div>

  <div class="kpi" title="${esc(A.risk_rule.text)}"><div class="l">Needs attention</div><div class="v ${K.at_risk.contracts?"neg":""}">${K.at_risk.contracts}</div><div class="s">${fmtK(K.at_risk.value_k)} · ${esc(A.risk_rule.text.toLowerCase())}</div></div>
  <div class="kpi"><div class="l">Sole-source contracts</div><div class="v">${K.sole_source.contracts}</div><div class="s">${fmtK(K.sole_source.value_k)} with no alternative supplier</div></div>

financials:()=>{
  const A=S.fin,F=S.ff;
  const msg=(h,t)=>`<div class="wrap" style="max-width:560px;padding-top:40px"><div class="card"><div class="ico" style="background:var(--ds);color:var(--d)">⎘</div><h2>${h}</h2><p>${esc(t)}</p><div style="margin-top:16px"><button class="btn primary" id="back-search">← Back to search</button></div></div></div>`;
  if(!A)return msg("Financial trends unavailable",S.ferr||"Something went wrong.");
  const sc=A.scope,cos=A.companies,multi=sc.companies.length>1,M=A.metric;
  if(!sc.companies.length)return msg("No financial data","Your account is not cleared for any company's quarterly reports.");
  const pk=q=>q.replace(/^Q(\d)-(\d{2})(\d{2})$/,"Q$1 '$3"),pl=q=>q.replace("-"," ");
  const sel=(k,label,opts)=>`<div><label for="g-${k}">${label}</label><select id="g-${k}">${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(F[k])?"selected":""}>${esc(o[1])}</option>`).join("")}</select></div>`;
  const pOpts=sc.periods.map(p=>[p,pl(p)]);
  const fv=(v,u)=>v==null?"—":u==="idx"?v.toFixed(0):u==="%"?v.toFixed(1)+"%":u==="$"?"$"+v.toFixed(2):Math.abs(v)>=1000?"$"+(v/1000).toFixed(2)+"B":"$"+v.toFixed(1)+"M";
  const gr=v=>v==null?'<span class="hint">—</span>':`<span class="${v>=0?"pos":"neg"}">${v>=0?"+":""}${v.toFixed(1)}%</span>`;
  const bp=v=>v==null?"":` <span class="${v>=0?"pos":"neg"}" title="change vs. same quarter last year">${v>=0?"+":"−"}${Math.abs(v)} bp</span>`;
  const COL=["#2f6fed","#e8890c","#13a38a"];
  const colorOf=t=>COL[sc.companies.findIndex(c=>c.ticker===t)%COL.length];
  const line=(rows,unit,label)=>{      // rows: [{ticker,vals:[...]}] aligned with A.periods
    const W=640,H=230,L=52,R=44,T=14,B=28,P=A.periods;
    const all=rows.flatMap(r=>r.vals).filter(v=>v!=null);
    if(!all.length||P.length<2)return'<p class="hint">Not enough quarters to draw a trend.</p>';
    let lo=Math.min(...all),hi=Math.max(...all);if(hi===lo){hi+=1;lo-=1}
    const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
    const x=i=>L+(W-L-R)*i/(P.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
    const rs=(hi-lo)/4,pw=Math.pow(10,Math.floor(Math.log10(rs))),fr=rs/pw,stp=(fr<=1?1:fr<=2?2:fr<=5?5:10)*pw,ticks=[];
    for(let v=Math.ceil(lo/stp)*stp;v<=hi;v+=stp)ticks.push(+v.toFixed(6));
    const grid=ticks.map(v=>{return`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${esc(unit==="$M"?"$"+Math.round(v).toLocaleString()+"M":fv(v,unit))}</text>`}).join("");
    const step=P.length>8?2:1;
    const xl=P.map((q,i)=>(P.length-1-i)%step===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(pk(q))}</text>`:"").join("");
    const lines=rows.map(r=>{const c=colorOf(r.ticker);
      const pts=r.vals.map((v,i)=>v==null?null:[x(i),y(v)]);
      const d=pts.map((p,i)=>p?(pts[i-1]?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1):"").join(" ");
      const dots=pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="${P.length>14?2:3}" fill="${c}"><title>${esc(r.ticker)} · ${esc(pl(P[i]))}: ${esc(fv(r.vals[i],unit))}</title></circle>`:"").join("");
      const last=pts.filter(Boolean).pop();
      return`<path class="ln" d="${d}" stroke="${c}"/>${dots}${last?`<text class="lb" x="${last[0]+6}" y="${last[1]+4}" style="fill:${c}">${esc(r.ticker)}</text>`:""}`}).join("");
    return`<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} by quarter">${grid}${xl}${lines}</svg>`};
  const at=(c,key)=>A.periods.map(p=>{const r=c.series.find(s=>s.period===p);return r?r[key]:null});
  const trend=line(cos.map(c=>({ticker:c.ticker,vals:at(c,M.key)})),M.unit,M.label);
  const idx=multi&&cos.length>1?line(cos.map(c=>({ticker:c.ticker,vals:A.periods.map(p=>{const r=c.indexed.find(s=>s.period===p);return r?r.value:null})})),"idx","Revenue indexed"):"";
  const legend=cos.length>1?`<div class="legend">${cos.map(c=>`<span><i style="background:${colorOf(c.ticker)}"></i>${esc(c.ticker)}</span>`).join("")}</div>`:"";
  const L1=cos.map(c=>{const l=c.latest,m=c.margin_change_bps_yoy;return`<tr><td><b>${esc(c.ticker)}</b> <span class="hint">${esc(pl(l.period))}</span></td><td>${fv(l.revenue)}</td><td>${gr(l.revenue_yoy)}</td><td>${fv(l.gross_margin,"%")}${bp(m.gross_margin)}</td><td>${fv(l.operating_margin,"%")}${bp(m.operating_margin)}</td><td>${fv(l.net_income)}</td><td>$${l.eps.toFixed(2)} ${gr(l.eps_yoy)}</td><td>${fv(l.free_cash_flow)}</td><td>${fv(l.ttm_revenue)}</td></tr>`}).join("");
  const kc=cos.length===1?(c=>{const l=c.latest;return`<div class="kpis">
   <div class="kpi"><div class="l">Revenue · ${esc(pl(l.period))}</div><div class="v">${fv(l.revenue)}</div><div class="s">${gr(l.revenue_yoy)} YoY · ${gr(l.revenue_qoq)} QoQ</div></div>
   <div class="kpi"><div class="l">Gross margin</div><div class="v">${fv(l.gross_margin,"%")}</div><div class="s">${c.margin_change_bps_yoy.gross_margin==null?"":(c.margin_change_bps_yoy.gross_margin>=0?"+":"−")+Math.abs(c.margin_change_bps_yoy.gross_margin)+" bp vs. last year"}</div></div>
   <div class="kpi"><div class="l">Operating margin</div><div class="v">${fv(l.operating_margin,"%")}</div><div class="s">${c.margin_change_bps_yoy.operating_margin==null?"":(c.margin_change_bps_yoy.operating_margin>=0?"+":"−")+Math.abs(c.margin_change_bps_yoy.operating_margin)+" bp vs. last year"}</div></div>
   <div class="kpi"><div class="l">Trailing 12-month revenue</div><div class="v">${fv(l.ttm_revenue)}</div><div class="s">${c.stats.revenue_cagr_2y_pct==null?"":c.stats.revenue_cagr_2y_pct+"% a year over two years"}</div></div></div>`})(cos[0]):"";
  const rk=A.ranking.length?`<div class="chart wide"><h3>Who leads · ${esc(pl(A.as_of))}</h3><div class="tw"><table class="rkt"><tbody>${A.ranking.map(r=>`<tr><td style="width:30%">${esc(r.measure)}</td><td><div class="rk">${r.order.map((o,i)=>`<span><b>${i+1}. ${esc(o.ticker)}</b> ${o.value>=0&&/growth/i.test(r.measure)?"+":""}${o.value.toFixed(1)}%</span>`).join("")}</div></td></tr>`).join("")}</tbody></table></div></div>`:"";
  const seg=cos.map(c=>`<div class="chart"><h3>${esc(c.ticker)} · revenue by segment</h3>${c.segments.map(g=>`<div class="hb" title="${esc(g.name)}: ${fv(g.revenue)} · ${g.share_pct}% of revenue"><span>${esc(g.name)}</span><span class="tr"><i style="width:${Math.max(2,Math.round(g.share_pct||0))}%"></i></span><span>${fv(g.revenue)} · ${g.yoy_pct==null?"—":(g.yoy_pct>=0?"+":"")+g.yoy_pct.toFixed(1)+"%"}</span></div>`).join("")}<p class="fn">Bar = share of revenue. Right column = revenue and growth vs. last year.</p></div>`).join("");
  const ST=cos.map(c=>{const s=c.stats,z=s.seasonality;return`<tr><td><b>${esc(c.ticker)}</b></td><td>${s.revenue_cagr_2y_pct==null?"—":s.revenue_cagr_2y_pct.toFixed(1)+"%"}</td><td>${s.qoq_mean_pct==null?"—":s.qoq_mean_pct.toFixed(1)+"%"}</td><td>${s.qoq_stdev_pct==null?"—":s.qoq_stdev_pct.toFixed(1)+" pts"}</td><td>${s.trend_slope_per_qtr>=0?"+":""}${s.trend_slope_per_qtr.toFixed(1)}</td><td>${s.trend_r2.toFixed(2)}</td><td>${z?["Q1","Q2","Q3","Q4"].map(q=>z[q]==null?"":`${q} ${z[q].toFixed(2)}`).filter(Boolean).join(" · "):"—"}</td></tr>`}).join("");
  const single=cos.length===1?cos[0]:null;
  const tbl=single?`<div class="tw"><table class="num"><thead><tr>${["Quarter","Revenue","QoQ","YoY","Gross margin","Op. margin","Net income","EPS","Free cash flow"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${[...single.series].reverse().map(r=>`<tr><td>${esc(pl(r.period))}</td><td>${fv(r.revenue)}</td><td>${gr(r.revenue_qoq)}</td><td>${gr(r.revenue_yoy)}</td><td>${fv(r.gross_margin,"%")}</td><td>${fv(r.operating_margin,"%")}</td><td>${fv(r.net_income)}</td><td>$${r.eps.toFixed(2)}</td><td>${fv(r.free_cash_flow)}</td></tr>`).join("")}</tbody></table></div>`
   :`<div class="tw"><table class="num"><thead><tr><th>Quarter</th>${cos.map(c=>`<th>${esc(c.ticker)}</th>`).join("")}</tr></thead><tbody>${[...A.periods].reverse().map(p=>`<tr><td>${esc(pl(p))}</td>${cos.map(c=>{const r=c.series.find(s=>s.period===p);return`<td>${r?fv(r[M.key],M.unit):"—"}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
  return`<div class="wrap">
 <div class="banner"><span>🛡 Temporary view · Closing clears this data and signs you out.</span><span>⏱ <span id="tm"></span> remaining</span></div>
 <div id="warn-slot"></div>
 ${S.ferr?`<div class="alert" style="margin:0 0 10px"><b>Couldn't update the financials</b><span>${esc(S.ferr)}</span></div>`:""}
 <div class="top"><div><h2>Financial trends</h2><div class="scope"><span class="pill">${sc.companies.map(c=>esc(c.name)).join(" · ")}</span><span class="pill">Quarterly reports through ${esc(pl(A.as_of||"—"))}</span><span class="pill">$ millions</span></div></div>
 <div class="top-actions"><button class="btn sec" id="back-search" style="padding:7px 12px;font-size:12px">← Search</button><button class="btn sec" id="to-an" style="padding:7px 12px;font-size:12px">▥ Contract analytics</button><button class="btn sec" id="to-beh" style="padding:7px 12px;font-size:12px">◔ Customer behavior</button><button class="btn sec" id="sv" style="padding:7px 12px;font-size:12px">★ Save view</button><button class="btn sec" id="to-co" style="padding:7px 12px;font-size:12px">▦ Company overview</button><button class="btn sec" id="pr" style="padding:7px 12px;font-size:12px">⎙ Print / PDF</button><button class="btn sec" id="export-f" style="padding:7px 12px;font-size:12px">↓ Export CSV</button><button class="btn sec" id="close">✕ Close</button></div></div>
 <div class="filters">
  ${multi?sel("ticker","Company",[["","All my companies"],...sc.companies.map(c=>[c.ticker,c.name])]):""}
  ${sel("from","From",[["all","Earliest"],...pOpts])}
  ${sel("to","To",[["all","Latest"],...pOpts])}
  ${sel("metric","Chart measure",Object.entries(A.metrics).map(([k,v])=>[k,v.label]))}
 </div>
 <div id="an-body">
 ${!cos.length?'<p class="hint">No quarters fall inside this window.</p>':`
 ${kc}
 <div class="chart wide" style="margin-bottom:12px"><h3>Latest quarter</h3><div class="tw"><table class="num"><thead><tr>${["Company","Revenue","YoY","Gross margin","Op. margin","Net income","EPS (YoY)","Free cash flow","12-mo revenue"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${L1}</tbody></table></div></div>
 <div class="charts">
  <div class="chart wide"><h3>${esc(M.label)} by quarter</h3>${trend}${legend}</div>
  ${idx?`<div class="chart wide"><h3>Revenue growth since ${esc(pl(A.periods[0]))} · first quarter = 100</h3>${idx}${legend}<p class="fn">Indexing removes company size, so you can compare how fast each business has grown.</p></div>`:""}
  ${rk}
  ${seg}
 </div>
 <div class="chart wide" style="margin-bottom:12px"><h3>Trend statistics</h3><div class="tw"><table class="num"><thead><tr>${["Company","2-yr revenue CAGR","Avg QoQ growth","QoQ volatility (σ)","Trend ($M / qtr)","Fit (R²)","Seasonality (1.00 = year average)"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${ST}</tbody></table></div>
  <p class="fn">CAGR compares trailing-12-month revenue now with two years earlier. Trend is the least-squares slope of revenue per quarter; R² near 1 means growth has been steady. Volatility is the standard deviation of quarter-on-quarter growth, so seasonal businesses read high. Seasonality uses complete calendar years only.</p></div>
 <div class="top" style="margin-top:6px"><div><h2 style="font-size:18px">${single?esc(single.ticker)+" · quarter by quarter":esc(M.label)+" by quarter"}</h2><p class="hint">Figures come from the quarterly report PDFs · $ millions except EPS</p></div></div>
 ${tbl}`}
 </div></div>`},
banalyzing:()=>`<div class="wrap" style="max-width:560px;padding-top:40px"><div class="card"><b><span class="spin" style="color:var(--b)"></span> Preparing customer behavior…</b><div class="prog"><i></i></div><div class="hint">Only the companies your account is cleared to see are included.</div></div></div>`,
adminloading:()=>`<div class="wrap" style="max-width:560px;padding-top:40px"><div class="card"><b><span class="spin" style="color:var(--b)"></span> Loading administration…</b><div class="prog"><i></i></div></div></div>`,
admin:()=>{
  const A=S.adm;
  if(!A)return`<div class="wrap" style="max-width:560px;padding-top:40px"><div class="card"><div class="ico" style="background:var(--ds);color:var(--d)">⎘</div><h2>Administration unavailable</h2><p>${esc(S.admErr||"Something went wrong.")}</p><div style="margin-top:16px"><button class="btn primary" id="back-search">← Back to search</button></div></div></div>`;
  const O=A.options,F=A.form;
  const dept=ids=>[...new Set(ids.flatMap(t=>O.departments[t]||[]))].sort();
  const form=!F?"":(()=>{
    const ds=dept(F.document_ids),edit=F.mode==="edit";
    return`<div class="card" id="a-form" style="padding:14px 16px;margin-bottom:12px"><b>${edit?"Edit "+esc(F.username):"New account"}</b>
     ${S.admErr?`<div class="alert" style="margin:8px 0"><b>Couldn't save</b><span>${esc(S.admErr)}</span></div>`:""}
     <div class="two" style="margin:10px 0 0">
      <div><label for="a-user">Username</label><input id="a-user" value="${esc(F.username)}" ${edit?"disabled":""} maxlength="32" autocomplete="off"></div>
      <div><label for="a-pw">${edit?"New password (leave blank to keep)":"Password"}</label><input id="a-pw" type="password" value="${esc(F.password)}" autocomplete="new-password" placeholder="at least ${O.min_password} characters"></div></div>
     <div style="margin-top:10px"><label>Companies they can see</label><div class="chips" style="margin:4px 0">${O.companies.map(c=>`<label class="chip"><input type="checkbox" class="a-co" value="${c.ticker}" ${F.document_ids.includes(c.ticker)?"checked":""} style="width:auto;margin-right:6px">${esc(c.name)}</label>`).join("")}</div></div>
     <div><label>Contract departments</label><div class="chips" style="margin:4px 0"><label class="chip"><input type="radio" name="a-all" id="a-all" ${F.owners==null?"checked":""} style="width:auto;margin-right:6px">All departments</label><label class="chip"><input type="radio" name="a-all" id="a-some" ${F.owners!=null?"checked":""} ${ds.length?"":"disabled"} style="width:auto;margin-right:6px">Only these:</label>${ds.map(d=>`<label class="chip"><input type="checkbox" class="a-dp" value="${esc(d)}" ${(F.owners||[]).includes(d)?"checked":""} ${F.owners==null?"disabled":""} style="width:auto;margin-right:6px">${esc(d)}</label>`).join("")}</div><p class="hint">A department limit applies to supplier contracts only. Financials and customer behavior follow the company list.</p></div>
     <div><label class="chip"><input type="checkbox" id="a-adm" ${F.is_admin?"checked":""} style="width:auto;margin-right:6px">Administrator (manage accounts and read the audit log)</label></div>
     <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="a-save">${edit?"Save changes":"Create account"}</button><button class="btn sec" id="a-cancel">Cancel</button></div></div>`})();
  const tag=(t,c)=>`<span class="st ${c||""}">${esc(t)}</span>`;
  const users=`<div class="chart wide"><h3>Accounts · ${A.users.length}</h3><div class="tw"><table class="num auto"><thead><tr><th>Username</th><th>Companies</th><th>Contract departments</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${A.users.map(u=>`<tr><td><b>${esc(u.username)}</b>${u.username===S.user.id?' <span class="hint">(you)</span>':""}</td><td>${u.document_ids.length?u.document_ids.map(esc).join(", "):'<span class="hint">none</span>'}</td><td>${u.owners==null?"All":u.owners.length?u.owners.map(esc).join(", "):'<span class="hint">none</span>'}</td><td>${u.is_admin?tag("Admin","m"):"Analyst"}</td><td>${u.locked?tag("Locked","x"):u.sessions?tag("Signed in"):'<span class="hint">—</span>'}</td><td style="white-space:nowrap"><button class="btn sec a-edit" data-u="${esc(u.username)}" style="padding:3px 9px;font-size:11px">Edit</button> ${u.locked?`<button class="btn sec a-unlock" data-u="${esc(u.username)}" style="padding:3px 9px;font-size:11px">Unlock</button> `:""}${u.username===S.user.id?"":`<button class="btn sec a-del" data-u="${esc(u.username)}" style="padding:3px 9px;font-size:11px" title="Delete this account">✕</button>`}</td></tr>`).join("")}</tbody></table></div></div>`;
  const AU=A.audit,fmt=d=>new Date(d).toLocaleString();
  const audit=!AU?"":`${AU.flagged.length?`<div class="alert" style="margin:0 0 12px"><b>Accounts with repeated refusals or failed sign-ins</b><span>${AU.flagged.map(f=>`${esc(f.username)}: ${f.denied} denied, ${f.failed_signins} failed sign-ins, ${f.rate_limited} rate-limited`).join(" · ")}</span></div>`:""}
    <div class="filters"><div><label for="au-user">Account</label><input id="au-user" value="${esc(A.af.user)}" placeholder="any account"></div><div><label for="au-event">Event</label><select id="au-event">${[["","All events"],...AU.events.map(e=>[e,e])].map(o=>`<option value="${esc(o[0])}" ${o[0]===A.af.event?"selected":""}>${esc(o[1])}</option>`).join("")}</select></div></div>
    <div class="chart wide"><h3>Audit log · newest first · ${AU.entries.length} shown of ${AU.total} kept</h3><div class="tw"><table class="num auto"><thead><tr><th>Time</th><th>Account</th><th>Event</th><th>Detail</th><th>From</th></tr></thead><tbody>${AU.entries.map(e=>`<tr><td>${esc(fmt(e.ts))}</td><td>${esc(e.username||"—")}</td><td>${esc(e.event)}</td><td style="white-space:normal;max-width:420px"><small>${esc(JSON.stringify(e.detail))}</small></td><td>${esc(e.ip||"")}</td></tr>`).join("")||'<tr><td colspan="5" class="hint">No entries match.</td></tr>'}</tbody></table></div></div>`;
  return`<div class="wrap">
 <div class="banner"><span>🛡 Temporary view · Closing clears this data and signs you out.</span><span>⏱ <span id="tm"></span> remaining</span></div>
 <div id="warn-slot"></div>
 <div class="top"><div><h2>Administration</h2><div class="scope"><span class="pill">Administrator: ${esc(S.user.id)}</span></div></div>
 <div class="top-actions"><button class="btn sec" id="back-search" style="padding:7px 12px;font-size:12px">← Search</button>${A.tab==="users"?'<button class="btn primary" id="a-new" style="padding:7px 12px;font-size:12px">＋ New account</button>':'<button class="btn sec" id="export-au" style="padding:7px 12px;font-size:12px">↓ Export CSV</button>'}<button class="btn sec" id="close">✕ Close</button></div></div>
 <div class="chips" style="margin:6px 0 12px"><button class="chip" id="tab-users" ${A.tab==="users"?'style="border-color:var(--b);color:var(--b)"':""}>Accounts</button><button class="chip" id="tab-audit" ${A.tab==="audit"?'style="border-color:var(--b);color:var(--b)"':""}>Audit log</button></div>
 ${A.msg?`<div class="alert" style="margin:0 0 12px;background:var(--oks)"><b style="color:var(--ok)">${esc(A.msg)}</b></div>`:""}
 <div id="an-body">${A.tab==="users"?form+users:audit}</div></div>`},
canalyzing:()=>`<div class="wrap" style="max-width:560px;padding-top:40px"><div class="card"><b><span class="spin" style="color:var(--b)"></span> Preparing company overview…</b><div class="prog"><i></i></div><div class="hint">Only the companies and contracts your account is cleared to see are included.</div></div></div>`,
company:()=>{
  const A=S.co,F=S.cf;
  const msg=(h,t)=>`<div class="wrap" style="max-width:560px;padding-top:40px"><div class="card"><div class="ico" style="background:var(--ds);color:var(--d)">⎘</div><h2>${h}</h2><p>${esc(t)}</p><div style="margin-top:16px"><button class="btn primary" id="back-search">← Back to search</button></div></div></div>`;
  if(!A)return msg("Company overview unavailable",S.cerr||"Something went wrong.");
  const sc=A.scope,multi=sc.companies.length>1,limited=sc.owners!=null;
  if(!sc.companies.length||!A.companies.length)return msg("No company data","Your account is not cleared for any company.");
  const num=v=>v.toLocaleString(undefined,{maximumFractionDigits:1});
  const sg=(v,d=1)=>(v>=0?"+":"−")+Math.abs(v).toFixed(d);
  const gr=v=>v==null?'<span class="hint">—</span>':`<span class="${v>=0?"pos":"neg"}">${sg(v)}%</span>`;
  const lv={watch:["st x","Watch"],good:["st","Good"],info:["st m","Note"]};
  const sel=`<div><label for="c-ticker">Company</label><select id="c-ticker">${[["","All my companies"],...sc.companies.map(c=>[c.ticker,c.name])].map(o=>`<option value="${esc(o[0])}" ${o[0]===F.ticker?"selected":""}>${esc(o[1])}</option>`).join("")}</select></div>`;
  const body=A.companies.map(p=>{
    const f=p.financials,b=p.behavior,k=p.contracts.kpis,w=p.weight,g=b.growth;
    const bp=f.margin_change_bps_yoy.gross_margin;
    const kp=`<div class="kpis">

/* ===== CSV Export ===== */
function exportCsv(){
  const R=S.result;
  const cols=R.columns.filter(c=>c.type!=="pdf_link");
  const header=cols.map(c=>JSON.stringify(c.label)).join(",");
  const rows=R.rows.map(r=>cols.map(c=>JSON.stringify(String(r[c.key]||"").replace(/\*\*/g,""))).join(","));
  const csv=[header,...rows].join("\r\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`data-pull-${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function run(text){
  S.query=text;go("retrieving");
  try{const r=await DataService.retrieve(text);if(S.screen!=="retrieving")return;
    if(!r.rows||!r.rows.length){go("notfound");return}
    S.result=r;S.page=0;S.end=Date.now()+SESSION_MIN*60000;go("results")}
  catch(e){go("notfound")}
}

function downloadCsv(name,cols,rows){
  const cell=v=>JSON.stringify(typeof v==="string"&&/^[=+\-@\t\r]/.test(v)?"'"+v:(v==null?"":String(v)));   // neutralise spreadsheet formulas
  const csv=[cols.map(c=>JSON.stringify(c[1])).join(","),...rows.map(r=>cols.map(c=>cell(r[c[0]])).join(","))].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`${name}-${Date.now()}.csv`;a.click();URL.revokeObjectURL(a.href);
}

/* ===== Saved views and printing ===== */
const argOf=t=>typeof t==="string"?{ticker:t}:(t&&t.constructor===Object?t:{});
const VIEW_SCREENS={
  contracts:{label:"Contract analytics",screen:"analytics",get:()=>S.af,open:f=>openAnalytics(f)},
  financials:{label:"Financial trends",screen:"financials",get:()=>S.ff,open:f=>openFin(f)},
  behavior:{label:"Customer behavior",screen:"behavior",get:()=>S.bf,open:f=>openBeh(f)},
  company:{label:"Company overview",screen:"company",get:()=>S.cf,open:f=>openCo(f)},
};
const viewKind=()=>Object.keys(VIEW_SCREENS).find(k=>VIEW_SCREENS[k].screen===S.screen);
function saveViewForm(){
  const kind=viewKind();if(!kind||$("#sv-form"))return;
  const row=document.createElement("div");row.id="sv-form";row.className="card";
  row.style.cssText="padding:12px 14px;margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap";
  row.innerHTML=`<label for="sv-name" style="margin:0">Name this view</label><input id="sv-name" maxlength="60" style="flex:1;min-width:200px" placeholder="e.g. Q4 sole-source contracts"><button class="btn primary" id="sv-ok" style="padding:7px 14px">Save</button><button class="btn sec" id="sv-no" style="padding:7px 14px">Cancel</button><span id="sv-msg" class="hint" style="width:100%"></span>`;
  $(".top").after(row);$("#sv-name").focus();
  const done=()=>row.remove();
  const save=async()=>{
    const name=$("#sv-name").value.trim();if(!name){$("#sv-msg").textContent="Give the view a name.";return}
    const f={};for(const [k,v] of Object.entries(VIEW_SCREENS[kind].get()||{}))if(v!==""&&v!=="all"&&v!=="latest"&&v!=null)f[k]=v;
    try{await DataService.views("POST","",{name,screen:kind,filters:f});$("#sv-msg").innerHTML='<span class="pos">Saved. Find it on the search page under Saved views.</span>';setTimeout(done,1800)}
    catch(e){if(e.code==="UNAUTHORIZED"){endSession();return}$("#sv-msg").innerHTML='<span class="neg">'+esc(e.message)+'</span>'}
  };
  $("#sv-ok").onclick=save;$("#sv-no").onclick=done;$("#sv-name").onkeydown=e=>{if(e.key==="Enter")save();if(e.key==="Escape")done()};
}
async function renderSaved(){
  const slot=$("#sv-list");if(!slot)return;
  let list;try{list=(await DataService.views("GET")).views}catch(e){if(e.code==="UNAUTHORIZED")endSession();return}
  if(!$("#sv-list")||!list.length){if($("#sv-list"))$("#sv-list").innerHTML="";return}
  const nice=v=>Object.entries(v.filters).map(([k,x])=>k.replace("_"," ")+": "+x).join(" · ")||"no filters";
  $("#sv-list").innerHTML=`<div class="card" style="padding:16px"><b>Saved views</b><p class="hint" style="margin:2px 0 8px">Your own filters, saved from the analytics screens. Opening one runs it again with your current access.</p>${list.map(v=>`<div class="li"><span><a href="#" data-vid="${v.id}" class="vopen"><b>${esc(v.name)}</b></a><br><small>${esc(VIEW_SCREENS[v.screen].label)} · ${esc(nice(v))}</small></span><button class="btn sec vdel" data-vid="${v.id}" style="padding:3px 9px;font-size:11px" title="Delete this view">✕</button></div>`).join("")}</div>`;
  const by=id=>list.find(v=>String(v.id)===String(id));
  document.querySelectorAll(".vopen").forEach(a=>a.onclick=e=>{e.preventDefault();const v=by(a.dataset.vid);if(v)VIEW_SCREENS[v.screen].open(v.filters)});
  document.querySelectorAll(".vdel").forEach(b=>b.onclick=async()=>{try{await DataService.views("DELETE","/"+b.dataset.vid)}catch(e){}renderSaved()});
}
function printReport(){
  const wrap=document.querySelector(".wrap");if(!wrap)return;
  const f=[...document.querySelectorAll(".filters select")].map(s=>{const l=document.querySelector(`label[for="${s.id}"]`);return(l?l.textContent+": ":"")+s.options[s.selectedIndex].text}).join(" · ");
  const d=document.createElement("div");d.className="print-only";
  d.innerHTML=`<b>Fetch report</b> · prepared for ${esc(S.user.name)} (${esc(S.user.id)}) · ${new Date().toLocaleString()}${f?"<br>"+esc(f):""}<br>Sample data only. Shows only what this account is cleared to see.`;
  wrap.prepend(d);
  const clean=()=>{d.remove();window.removeEventListener("afterprint",clean)};
  window.addEventListener("afterprint",clean);window.print();
}

/* ===== Session countdown + expiry warning ===== */
function tick(){
  const el=$("#tm");if(!el)return;
  const s=Math.max(0,Math.round((S.end-Date.now())/1000));
  el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  // Show warning at 2 minutes remaining
  if(s<=120&&!S.warnShown){
    S.warnShown=true;
    const slot=$("#warn-slot");
    if(slot)slot.innerHTML=`<div class="warn-banner">⚠ Your session expires in ${Math.ceil(s/60)} minute${s>60?"s":""}. <button class="btn sec" style="padding:3px 10px;font-size:11px" onclick="extendSession()">Extend session</button></div>`;
  }
  if(s===0)endSession();
}
async function extendSession(){
  await DataService.refresh();
  S.end=Date.now()+SESSION_MIN*60000;
  S.warnShown=false;
  const slot=$("#warn-slot");
  if(slot)slot.innerHTML="";
}

function confirmClose(){
  const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><div class="ico" style="background:var(--ds);color:var(--d);margin:0 0 12px">⇥</div><h2 style="font-size:20px">Close this session?</h2><p style="color:var(--t)">Closing will end your session and clear this data. Continue?</p><p class="hint">You'll need to sign in again to make another request.</p><div class="row"><button class="btn sec" id="no">Cancel</button><button class="btn danger" id="yes">Close and log out</button></div></div>`;
  document.body.appendChild(o);$("#no",o).focus();
  $("#no",o).onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};
  $("#yes",o).onclick=()=>{o.remove();endSession()};
}
async function endSession(){
  clearInterval(S.timer);S.result=null;S.analysis=null;S.af=null;S.aerr=null;S.fin=null;S.ff=null;S.ferr=null;S.beh=null;S.bf=null;S.berr=null;S.co=null;S.cf=null;S.cerr=null;S.adm=null;S.admErr=null;S.query="";S.err=null;S.warnShown=false;
  try{await DataService.signOut()}catch(e){}
  S.user=null;go("loggedout");
}
function openPdf(url,title){
  const o=document.createElement("div");o.className="pdf-ov";
  o.innerHTML=`<div class="pdf-bar"><span>📄 ${esc(title)}</span><a href="${esc(url)}" target="_blank" rel="noopener" class="btn sec" style="padding:4px 10px;font-size:11px;flex:none">↗ Open in tab</a><button class="btn sec" style="padding:4px 10px;font-size:11px;flex:none" id="pdf-close">✕ Close</button></div><iframe class="pdf-frame" src="${esc(url)}" title="${esc(title)}"></iframe>`;
  document.body.appendChild(o);
  $("#pdf-close",o).onclick=()=>o.remove();
  o.addEventListener("keydown",e=>{if(e.key==="Escape")o.remove()});
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){const p=$(".pdf-ov");if(p){p.remove();return}const o=$(".ov");o&&o.remove()}
});
go("login");
